<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shiv Gehlot</title>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />

  <style>
    :root {
      --bg: #f5f5f7;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --accent: #0066cc;
      --line: rgba(29, 29, 31, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: "DM Sans", sans-serif;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
  width: min(720px, calc(100% - 48px));

  min-height: 100vh;

  margin-left: clamp(48px, 9vw, 140px);

  display: flex;
  align-items: center;

  padding:
    0
    0
    120px;

  transform: translateY(-6vh);
}

    .intro {
      display: flex;
      align-items: center;
      gap: 28px;
      width: 100%;
    }

    .photo {
      width: 126px;
      height: 126px;

      flex: 0 0 auto;

      object-fit: cover;
      border-radius: 50%;

      border: 4px solid #ffffff;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.09),
        0 0 0 1px rgba(0, 0, 0, 0.04);
    }

    .profile-info {
      min-width: 0;
    }

    h1 {
      margin: 0;

      font-size: 2.35rem;
      line-height: 1.02;

      font-weight: 700;
      letter-spacing: -0.05em;
    }

    .title {
      margin: 10px 0 0;

      color: var(--muted);

      font-size: 1rem;
      font-weight: 500;
    }

    .research-line {
      margin: 13px 0 0;

      color: #3a3a3c;

      font-size: 0.95rem;
      line-height: 1.55;
    }

    .links {
      display: flex;
      align-items: center;
      flex-wrap: wrap;

      gap: 18px;

      margin-top: 18px;
    }

    .links a {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      color: var(--text);

      font-size: 0.9rem;
      font-weight: 600;

      padding-bottom: 2px;

      border-bottom: 1px solid transparent;

      transition:
        color 0.18s ease,
        border-color 0.18s ease;
    }

    .links a i {
      color: var(--muted);
      font-size: 0.88rem;
      transition: color 0.18s ease;
    }

    .links a:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .links a:hover i {
      color: var(--accent);
    }
.footer {
  position: fixed;

  left: clamp(48px, 9vw, 140px);
  right: 48px;
  bottom: 24px;

  max-width: 720px;

  padding-top: 16px;

  border-top: 1px solid var(--line);

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 16px;

  color: var(--muted);
  font-size: 0.78rem;
}

    .visits {
      display: inline-flex;
      align-items: center;

      gap: 7px;
    }

    .visits i {
      font-size: 0.75rem;
    }

    .visits img {
      display: block;

      height: 16px;

      opacity: 0.74;
    }

    @media (max-width: 700px) {
      .page {
        width: auto;

        min-height: auto;

        margin: 0;

        align-items: flex-start;

        padding: 52px 22px 36px;
      }

      .intro {
        align-items: flex-start;
        gap: 18px;
      }

      .photo {
        width: 92px;
        height: 92px;
      }

      h1 {
        font-size: 1.75rem;
      }

      .title {
        font-size: 0.92rem;
      }

      .research-line {
        font-size: 0.89rem;
      }

      .links {
        gap: 14px;
      }

      .footer {
        position: static;

        width: auto;

        margin: 36px 22px 24px;

        transform: none;

        flex-wrap: wrap;
      }
    }

    @media (max-width: 460px) {
      .intro {
        flex-direction: column;
      }

      .photo {
        width: 104px;
        height: 104px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="intro">

      <img
        class="photo"
        src="img/profile_pic.jpeg"
        alt="Shiv Gehlot"
      />

      <div class="profile-info">
        <h1>Shiv Gehlot</h1>

        <p class="title">
          Staff Researcher, Dolby Laboratories
        </p>

        <p class="research-line">
          Computer Vision · Multimodal Learning · Generative AI
        </p>

        <nav class="links">
          <a
            href="https://scholar.google.com/citations?hl=en&user=SmSs6d0AAAAJ&view_op=list_works&sortby=pubdate"
            target="_blank"
            rel="noopener noreferrer"
          >
            <i class="fas fa-graduation-cap"></i>
            Scholar
          </a>

          <a
            href="https://github.com/shivgahlout"
            target="_blank"
            rel="noopener noreferrer"
          >
            <i class="fab fa-github"></i>
            GitHub
          </a>

          <a
            href="https://www.linkedin.com/in/shivgehlot/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <i class="fab fa-linkedin-in"></i>
            LinkedIn
          </a>
        </nav>
      </div>

    </section>
  </main>

  <footer class="footer">

    <span>
      Last updated · July 2026
    </span>

    <span class="visits">
      <i class="fa-regular fa-eye"></i>

      <img
        src="https://hits.sh/shivgahlout.github.io.svg?style=flat-square&color=999999&label=&labelColor=ffffff"
        alt="Visits"
      />
    </span>

  </footer>
</body>
</html>

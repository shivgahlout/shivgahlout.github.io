<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shiv Gehlot</title>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />

  <style>
    :root {
      --bg: #fbfaf8;
      --text: #222;
      --muted: #60656f;
      --accent: #1f4e79;
      --line: rgba(0,0,0,0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", sans-serif;
      color: var(--text);

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(31,78,121,0.06),
          transparent 32%
        ),
        linear-gradient(
          135deg,
          #fdfdfb,
          #efede8
        );

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(680px, calc(100% - 48px));
      margin-left: clamp(40px, 12vw, 175px);
      padding-top: 88px;
    }

    .intro {
      display: flex;
      align-items: center;
      gap: 26px;
    }

    .photo {
      width: 116px;
      height: 116px;
      flex: 0 0 auto;

      border-radius: 50%;
      object-fit: cover;

      border: 3px solid rgba(255,255,255,0.92);

      box-shadow:
        0 6px 18px rgba(0,0,0,0.10),
        0 0 0 1px rgba(0,0,0,0.04);
    }

    .profile-info {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: 1.95rem;
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: -0.035em;
    }

    .title {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 0.97rem;
      font-weight: 500;
    }

    .bio {
      margin: 10px 0 0;
      color: #353a41;
      font-size: 0.94rem;
      line-height: 1.5;
    }

    .links {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 14px;
    }

    .links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #3d4248;
      font-size: 1.18rem;

      transition:
        color 0.18s ease,
        transform 0.18s ease;
    }

    .links a:hover {
      color: var(--accent);
      transform: translateY(-2px);
    }

    .footer {
      position: fixed;
      left: clamp(40px, 12vw, 175px);
      bottom: 24px;

      display: flex;
      align-items: center;
      gap: 18px;

      color: var(--muted);
      font-size: 0.78rem;
    }

    .visits {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .visits i {
      font-size: 0.76rem;
    }

    .visits img {
      display: block;
      height: 16px;
      opacity: 0.75;
    }

    @media (max-width: 700px) {
      body {
        min-height: auto;
      }

      .page {
        width: auto;
        margin-left: 0;
        padding: 48px 22px 30px;
      }

      .intro {
        align-items: flex-start;
        gap: 18px;
      }

      .photo {
        width: 90px;
        height: 90px;
      }

      h1 {
        font-size: 1.65rem;
      }

      .title {
        font-size: 0.91rem;
      }

      .bio {
        font-size: 0.89rem;
      }

      .footer {
        position: static;
        margin-top: 42px;
        padding-top: 15px;

        border-top: 1px solid var(--line);

        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="intro">

      <img
        class="photo"
        src="img/profile_pic.jpeg"
        alt="Shiv Gehlot"
      />

      <div class="profile-info">
        <h1>Shiv Gehlot</h1>

        <p class="title">
          Staff Researcher, Dolby Laboratories
        </p>

        <p class="bio">
          Computer Vision · Multimodal Learning · Generative AI
        </p>

        <nav class="links">
          <a
            href="https://scholar.google.com/citations?hl=en&user=SmSs6d0AAAAJ&view_op=list_works&sortby=pubdate"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Google Scholar"
            title="Google Scholar"
          >
            <i class="fas fa-graduation-cap"></i>
          </a>

          <a
            href="https://github.com/shivgahlout"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub"
            title="GitHub"
          >
            <i class="fab fa-github"></i>
          </a>

          <a
            href="https://www.linkedin.com/in/shivgehlot/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn"
            title="LinkedIn"
          >
            <i class="fab fa-linkedin-in"></i>
          </a>
        </nav>
      </div>

    </section>
  </main>

  <footer class="footer">
    <span>
      Last updated · 2026
    </span>

    <span class="visits">
      <i class="fa-regular fa-eye"></i>

      <img
        src="https://hits.sh/shivgahlout.github.io.svg?style=flat-square&color=999999&label=&labelColor=ffffff"
        alt="Visits"
      />
    </span>
  </footer>
</body>
</html>
